<script>
/* ===== HARD BURN core-loop engine (no DOM below this marker) ===== */
const DOM=typeof document!=='undefined';
let seed=(Date.now()%2147483647)|0;
function setSeed(s){seed=s|0}
function rnd(){seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
const d6=()=>1+Math.floor(rnd()*6),pick=a=>a[Math.floor(rnd()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),rint=(a,b)=>a+Math.floor(rnd()*(b-a+1));
const TIERS=['Disaster','Failure','Mixed','Success','Critical'];
const tierOf=t=>t<=4?0:t<=6?1:t<=9?2:t<=11?3:4;
const P2=[0,0,1,2,3,4,5,6,5,4,3,2,1];
function odds(mod){const o=[0,0,0,0,0];for(let s=2;s<=12;s++)o[tierOf(s+mod)]+=P2[s]/36;return o}
const SK=['pilot','eng','med','gun','sys','neg'];
const SKN={pilot:'Piloting',eng:'Engineering',med:'Medicine',gun:'Gunnery',sys:'Systems',neg:'Negotiation'};
const SKS={pilot:'PLT',eng:'ENG',med:'MED',gun:'GUN',sys:'SYS',neg:'NEG'};
const PLACES={Ceres:{f:'Belt',fuel:1,food:1},Vesta:{f:'Belt',fuel:1.1,food:1.1},Mars:{f:'Mars',fuel:.9,food:1.25},Luna:{f:'Earth',fuel:1.1,food:.9},Ganymede:{f:'Outer',fuel:1.3,food:1}};
const DIST={'Ceres-Vesta':3,'Ceres-Mars':6,'Ceres-Ganymede':8,'Ceres-Luna':9,'Vesta-Mars':5,'Vesta-Ganymede':10,'Vesta-Luna':8,'Mars-Luna':4,'Mars-Ganymede':9,'Luna-Ganymede':11};
const THR={'Ceres-Vesta':2,'Ceres-Mars':1,'Ceres-Ganymede':2,'Ceres-Luna':1,'Vesta-Mars':1,'Vesta-Ganymede':3,'Vesta-Luna':2,'Mars-Luna':0,'Mars-Ganymede':1,'Luna-Ganymede':1};
const dist=(a,b)=>DIST[a+'-'+b]||DIST[b+'-'+a];
const WORLD=[{n:'Raider surge',d:'Pirate activity is up around the Belt.',t:(a,b)=>(PLACES[a].f=='Belt'||PLACES[b].f=='Belt')?1:0},
 {n:'Earth–Mars tension',d:'Navy patrols and customs checks everywhere inner-system.',t:(a,b)=>['Mars','Earth'].some(f=>PLACES[a].f==f||PLACES[b].f==f)?1:0,customs:1},
 {n:'Fuel shortage',d:'Fuel costs 40% more everywhere.',t:()=>0,fuel:1.4}];
const BURN={cruise:{n:'Cruise',days:1,fuel:2,note:'Standard burn.'},hard:{n:'Hard Burn',days:.7,fuel:4,note:'30% fewer days, +40% fuel, +1 stress to everyone, injuries more likely.'},eco:{n:'Economy',days:1.4,fuel:1.2,note:'40% more days, 16% less fuel, more time for trouble to find you.'}};
const RATION={full:{f:1,s:0,n:'Full rations',note:'Normal food use, no morale cost.'},half:{f:.7,s:.25,n:'Half rations',note:'30% less food. Stress creeps up.'},quarter:{f:.5,s:.7,n:'Starvation rations',note:'50% less food. Stress climbs fast.'}};
const PRICE={fuel:20,food:8,spares:60,meds:40,slug:8,torp:85,belt:3,cm:25};
const HOLDW={food:.25,spares:1,meds:.5,slug:.2,torp:1.5,belt:.1,cm:.3};
const AMMO=['slug','torp','belt','cm'];const AMN={slug:'Rail slugs',torp:'Torpedoes',belt:'PDC belts',cm:'Decoys'};const WAM={rail:'slug',torp:'torp',pdc:'belt'};
/* fire levels: n = rounds spent, a = attack bonus, d = extra damage (torpedoes: per-missile count) */
const WFIRE={rail:[{n:1,l:'Single',a:0,d:0},{n:2,l:'Double tap',a:1,d:2},{n:3,l:'Barrage',a:2,d:4}],torp:[{n:1,l:'One torpedo',a:0,d:0},{n:2,l:'Salvo of two',a:1,d:0}],pdc:[{n:1,l:'Short burst',a:0,d:0},{n:2,l:'Long burst',a:1,d:1},{n:4,l:'Sustained',a:2,d:2}]};
const HOLD=40,UPG={hull:{n:'Reinforced plating',d:'+8 max hull, repaired on install',cost:600,max:2},tank:{n:'Extended fuel tanks',d:'+20 fuel capacity',cost:400,max:2},hold:{n:'Cargo bay expansion',d:'+8 hold space',cost:700,max:2},drive:{n:'Corrin Drive tuning',d:'−10% fuel use on every burn',cost:900,max:2},rail:{n:'Railgun capacitors',d:'+1 railgun damage',cost:800,max:2},sens:{n:'Sensor array refit',d:'+1 to all attack rolls',cost:600,max:1},doc:{n:'Auto-doc bay',d:'Injured heal twice as fast; critical cases stabilize on their own',cost:900,max:1},ecm:{n:'ECM suite',d:'+2 to jamming and hacking incoming torpedoes',cost:700,max:1},berth:{n:'Better berths',d:'Crew shed stress faster',cost:600,max:1}},DEADLINE=50,DEBT0=6500;
const FACT=['Earth','Mars','Belt','Outer'];
const NAMES=['Ilse Brandt','Tobias Kehl','Marisol Vega','Abe Quill','Noor Haddad','Pavel Orlov','Chidi Mensah','Wren Tallis','Yusuf Amir','Dagny Holm','Sol Reyes','Imani Cole','Karl Ibsen','Mina Park','Rafa Duarte'];
const TRAITS=['Cautious','Reckless','Calm','Loyal','Paranoid','Ambitious'];
const BGS=['Ex-military','Ex-corp','Belter','Academic','Convict','Smuggler\'s kid'];
let G=null,CID=1;
const sub=(c)=>c;
function mkCrew(name,sk,tr,bg,wage){return{id:CID++,name,sk:Object.assign({pilot:0,eng:0,med:0,gun:0,sys:0,neg:0},sk),tr,bg,wage:wage||100,stress:0,inj:0,heal:0,dying:0,away:0,broke:0}}
function mkHire(){const a=pick(SK),b=pick(SK.filter(x=>x!=a));return mkCrew(pick(NAMES),{[a]:rint(1,3),[b]:rint(0,2)},[pick(TRAITS)],pick(BGS),rint(80,130))}
const bp=c=>8+(c.tr.includes('Calm')?2:0)-(c.tr.includes('Paranoid')?1:0);
function tierName(c){const r=c.stress/bp(c);return r>=1?'Breaking':r>=.7?'Frayed':r>=.4?'Strained':'Steady'}
const tierPen=c=>({Steady:0,Strained:0,Frayed:-1,Breaking:-2})[tierName(c)];
function addStress(c,n){if(n>0&&c.tr.includes('Calm'))n=Math.max(0,n-1);c.stress=clamp(c.stress+n,0,15)}
const alive=()=>G.crew.filter(c=>c.inj<2&&!c.away);
const hold=()=>{const s=G.ship;let h=(G.job?G.job.units:0);for(const k in HOLDW)h+=s[k]*HOLDW[k];return Math.round(h*10)/10};
function log(t,cls){G.log.unshift({d:G.day,t,c:cls||''});if(G.log.length>80)G.log.pop()}
function skillMod(c,sk,ap){let m=(c.sk[sk]||0)+tierPen(c)-(c.inj==1?1:c.inj==2?3:0);if(ap){m+=ap.m||0;if(c.tr.includes('Cautious')&&ap.risk===0)m+=1;if(c.tr.includes('Reckless')&&ap.risk===2)m+=1}if(sk=='sys'&&c.tr.includes('Paranoid'))m+=1;if(G.trip&&G.trip.burn=='hard'&&sk=='pilot')m-=0;return clamp(m,-5,5)}
function faultFx(k){return G.ship.faults.filter(f=>f.fx==k).length}
function hurtRoll(c,sk,why){const d=[d6(),d6()];let t=d[0]+d[1]+(c.sk[sk]||0)+tierPen(c)+(G.trip&&G.trip.burn=='hard'?-1:0);let r;
 if(t>=9)r='braced';else if(t>=6){c.inj=Math.min(2,c.inj+1);c.heal=6;r='hurt';G.st.hurt++}else{c.inj=2;c.dying=3;c.heal=0;r='serious';G.st.hurt++}
 if(r!='braced'){addStress(c,1);G.crew.forEach(o=>{if(o!==c)addStress(o,r=='serious'?2:1)})}
 log(`${c.name} ${r=='braced'?'braced in time and avoided injury':r=='hurt'?'was hurt':'was seriously injured'} (${d[0]}+${d[1]}${t-d[0]-d[1]>=0?'+':''}${t-d[0]-d[1]}).`,r=='braced'?'':'bad');return r}
const FAULTS={drive:[['Injector misfire','No Hard Burn until fixed','hard'],['Coolant leak','Fuel burn +30%','fuel']],weap:[['Feed jam','-1 to attack rolls','atk'],['Targeting drift','-1 to attack rolls','atk']],sens:[['Cracked array','-1 to attack rolls','atk'],['Noisy transponder','Incident chance +6%','inc']],pdc:[['Servo jam','Torpedo intercept -2','pdc']],life:[['Scrubber fault','+1 stress per day to everyone','str'],['Heater loop leak','Food spoils faster','food']]};
function addFault(subs){const k=subs||pick(Object.keys(FAULTS));const opts=FAULTS[k].filter(f=>!G.ship.faults.some(x=>x.n==f[0]));if(!opts.length)return null;const f=pick(opts);G.ship.faults.push({n:f[0],d:f[1],fx:f[2],sub:k,age:0});return f[0]}
/* ---------- effects ---------- */
function eff(tk,ctx,dry){const m=tk.match(/^([A-Za-z]+)(?::([A-Za-z0-9]+))?([+-]\d+)?$/);if(!m)return '';const k=m[1],arg=m[2],n=m[3]?+m[3]:0,s=G.ship,ac=ctx.actor,sj=ctx.subject;const sg=v=>(v>0?'+':'')+v;
 const num=(key,label,mx)=>{if(!dry){s[key]=clamp(s[key]+n,0,mx||999)}return`${label} ${sg(n)}`};
 switch(k){
 case'hull':if(!dry)s.hull=clamp(s.hull+n,0,s.hullMax);return'Hull '+sg(n);
 case'fuel':return num('fuel','Fuel',s.fuelMax);
 case'food':return num('food','Food');case'spares':return num('spares','Spares');case'meds':return num('meds','Meds');case'slug':case'mun':return num('slug','Rail slugs');case'torp':return num('torp','Torpedoes');case'belt':return num('belt','PDC belts');case'cm':return num('cm','Decoys');
 case'cred':if(!dry){G.credits+=n;if(n<0&&G.credits<0)G.credits=0}return'Credits '+sg(n);
 case'delay':if(!dry&&G.trip)G.trip.total+=n;return'+'+n+' day'+(n>1?'s':'');
 case'skip':if(!dry&&G.trip)G.trip.total=Math.max(G.trip.done+1,G.trip.total-n);return'−'+n+' day'+(n>1?'s':'')+' saved';
 case'stress':if(!dry&&ac)addStress(ac,n);return(ac?ac.name.split(' ')[0]:'')+' stress '+sg(n);
 case'stressS':if(!dry&&sj)addStress(sj,n);return(sj?sj.name.split(' ')[0]:'')+' stress '+sg(n);
 case'stressAll':if(!dry)G.crew.forEach(c=>addStress(c,n));return'Crew stress '+sg(n);
 case'hurt':if(!dry&&ac)hurtRoll(ac,ctx.sk||'eng');return ac?'Injury risk: '+ac.name.split(' ')[0]:'';
 case'hurtS':if(!dry&&sj)hurtRoll(sj,'med');return sj?'Injury risk: '+sj.name.split(' ')[0]:'';
 case'fault':if(!dry){const f=addFault();if(f)log('Fault: '+f,'bad')}return'Ship fault';
 case'cargo':if(!dry&&G.job){G.job.units=Math.max(0,G.job.units+n);G.job.lost=(G.job.lost||0)-n}return'Cargo '+sg(n);
 case'cargoAll':if(!dry&&G.job){G.job.lost=(G.job.lost||0)+G.job.units;G.job.units=0}return'All cargo lost';
 case'rep':if(!dry)G.rep[arg]+=n;return arg+' rep '+sg(n);
 case'flag':if(!dry)G.q.flags[arg]=1;return'';
 case'loot':if(!dry){const c=rint(150,450);G.credits+=c;let t='';if(rnd()<.45){s.spares++;t+=' +1 spares'}if(rnd()<.4){s.slug+=6;t+=' +6 rail slugs'}if(rnd()<.3){s.belt+=6;t+=' +6 PDC belts'}if(rnd()<.15){s.torp+=1;t+=' +1 torpedo'}if(rnd()<.25){s.cm+=2;t+=' +2 decoys'}ctx.lootNote=`Salvaged ${c} credits${t}.`;log(ctx.lootNote,'good')}return'Salvage';
 case'combat':case'ambush':if(!dry)ctx.combat=[arg,k=='ambush'];return(k=='ambush'?'Ambushed: ':'Combat: ')+(ENEMIES[arg]?ENEMIES[arg].name:arg);
 case'world':if(!dry){G.ev={e:WORLD[+arg],until:G.day+25};log('World event: '+WORLD[+arg].n,'warn')}return'World event: '+WORLD[+arg].n;
 case'item':if(!dry){G.ship.item=arg;if(arg=='pdc2'){(G.ship.extra=G.ship.extra||[]).push({id:'pdcX',key:'extra',t:'pdc',n:'Prototype PDC',arc:[4,5,0,1,2],mask:[],pen:0,bonus:0});rebuildMounts()}}return'Gained: '+(arg=='pdc2'?'Prototype PDC mount':arg);
 case'discount':if(!dry)G.fuelDiscount=n/100;return'Fuel -'+(n/100*100)+'% (Co-op scrip)';
 case'repair':if(!dry){const f=s.faults.shift();if(f)log('Repaired: '+f.n)}return'Fault repaired';
 }return''}
const chips=(effs,ctx)=>(effs?effs.split(',').filter(Boolean):[]).map(t=>eff(t,ctx,true)).filter(Boolean);
function applyEffs(effs,ctx){(effs?effs.split(',').filter(Boolean):[]).forEach(t=>eff(t,ctx,false))}

function enemyAttack(free){const cb=G.cb,e=cb.e,s=G.ship,o=cb.o,L=cb.log;if(e.hull<=0)return;

 const pil=stationCrew('helm');const def=(o.helm=='evade'&&!free?2:0)+(o.stance=='def'?1:0)-(o.stance=='aggr'?1:0)+(cb.ph>0?2:0)+(pil?Math.floor(Math.max(0,skillMod(pil,'pilot'))/2):0);

 if(ti<=1){L.push(`${nm}: miss.`);return}if(ti==2)dmg=Math.ceil(dmg/2);if(ti==4)dmg*=2;
 const locs=['hull','hull','hull','drive','weap','sens','pdc','life'];const loc=pick(locs);
 if(loc=='hull'){s.hull-=dmg;L.push(`${nm}: ${TIERS[ti]}, hull -${dmg}.`)}else{s.hull-=Math.ceil(dmg/2);const was=s.sub[loc];s.sub[loc]=Math.max(0,s.sub[loc]-dmg);L.push(`${nm}: ${TIERS[ti]}, ${loc=='weap'?'weapons':loc=='sens'?'sensors':loc=='pdc'?'PDC':loc=='life'?'life support':'drive'} -${dmg}, hull -${Math.ceil(dmg/2)}.`);

  if(rnd()<.6||s.sub[loc]==0){const f=addFault(loc);if(f)L.push('Fault: '+f)}
  const who={drive:'eng',weap:'gun',pdc:'gun',sens:'sys',life:'med'}[loc];const pc=stationCrew(who=='eng'?'eng':who=='gun'?'gun':'cmd');
  if(pc&&rnd()<(ti==4?.9:.6)){const r=hurtRoll(pc,{drive:'eng',weap:'gun',pdc:'gun',sens:'sys',life:'med'}[loc]);if(r!='braced')L.push(`${pc.name} is ${r=='hurt'?'hurt':'seriously hurt'}.`)}}
 if(loc=='hull'&&rnd()<.25){const pc=pick(alive());if(pc){const r=hurtRoll(pc,'eng');if(r!='braced')L.push(`${pc.name} is ${r=='hurt'?'hurt':'seriously hurt'}.`)}}}
function combatRound(){const cb=G.cb;if(!cb||cb.over)return;const o=cb.o,e=cb.e,s=G.ship,L=cb.log,m=combatMods();G.st.rounds++;G.st.dec++;cb.prev=cb.range;cb.pbear=cb.bear;cb.fxOut=null;cb.fxIn=[];L.push(`— Round ${cb.round} —`);

 cb.pw=0;cb.ph=0;if(o.eng=='pw')cb.pw=1;if(o.eng=='ph')cb.ph=1;
 if(o.eng=='over'&&en){cb.pw=1;cb.ph=1;const d=[d6(),d6()],t=d[0]+d[1]+skillMod(en,'eng');L.push(`Overload: all stations +2 this round.`);if(t<=6){const f=addFault();s.hull-=2;L.push(`The overload backfires (${d[0]}+${d[1]}): hull -2${f?', fault: '+f:''}.`)}}
 const m2=combatMods();
 // command actions
 if(o.stance=='parley'){const n=stationCrew('cmd'),d=[d6(),d6()],t=d[0]+d[1]+(n?skillMod(n,'neg'):-2)+(e.kind=='raider'?-6:e.kind=='navy'?-1:0),ti=tierOf(t);L.push(`Parley (${d[0]}+${d[1]}): ${TIERS[ti]}.`);

  else if(ti==2&&e.kind=='pirate'){const lose=G.job?Math.ceil(G.job.units/2):0;if(G.job){G.job.units-=lose;G.job.lost=(G.job.lost||0)+lose;G.rep[G.job.fac]-=1}L.push(`They take${lose?` ${lose} units of cargo`:' a handful of supplies'} and leave.`);endCombat('parley');return}

  if(s.sub.drive<=0||(cb.range<2&&t<=q)){L.push(cb.range==2?'You are too close to break away.':'They keep up.');enemyAttack(false);cb.round++;postRound();return}
  if(t>q||(cb.range==0&&t>=q)){s.fuel=Math.max(0,s.fuel-4);addAll(1);L.push('You burn away and break contact. Fuel -4.');endCombat('flee');return}}
 // helm contest
 if(o.helm!='hold'&&o.helm!='evade'||e.pref!=cb.range){const pl=d6()+d6()+m2.hm,en2=d6()+d6()+e.pil+(e.sub.drive<=0?-3:0);
  if(pl>en2){const dir=o.helm=='close'?1:o.helm=='open'?-1:0;if(dir){cb.range=clamp(cb.range+dir,0,2);L.push(`You win the helm contest (${pl}-${en2}) and move to ${RANGE[cb.range]} range.`)}}

 turnShip();enemyMove(m2);

 if(e.hull<=0){endCombat('win');return}
 const fl=e.hull<=e.max*.4&&e.flee>0&&rnd()<.55;
 if(fl){L.push(`${e.name} breaks off and runs.`);endCombat('fled');return}
 enemyAttack(false);cb.round++;postRound()}
function addAll(n){G.crew.forEach(c=>addStress(c,n))}
function postRound(){G.cb.o.helm=G.cb.o.helm=='evade'?'hold':G.cb.o.helm;checkDefeat()}
function checkDefeat(){if(G.cb&&!G.cb.over&&G.ship.hull<=0)defeat('combat')}

 if(r=='win'){const c=rint(e.loot[0],e.loot[1]);G.credits+=c;G.crew.forEach(x=>{x.stress=Math.max(0,x.stress-1)});cb.log.push(c?`${e.name} destroyed. You salvage ${c} cr.`:`${e.name} destroyed.`);if(e.kind=='navy'){G.rep.Earth-=2;G.rep.Mars-=1}}
 if(r=='fled'){const c=Math.round(e.loot[1]*.3);cb.log.push('They limp away.')}
 if(r=='flee'){}
 if(!G.crew.length){defeat('crew')}
 checkBreaks()}
function surrender(){const cb=G.cb;if(!cb||cb.over||cb.e.kind=='raider')return;const e=cb.e,L=cb.log;const early=G.ship.hull>G.ship.hullMax*.6?1:0;const n=stationCrew('cmd'),d=[d6(),d6()],t=d[0]+d[1]+(n?skillMod(n,'neg'):-2)+early,ti=tierOf(t);L.push(`You surrender (${d[0]}+${d[1]}): ${TIERS[ti]}.`);

 if(ti>=3){const l=Math.ceil(lost/2);if(G.job){G.job.units-=l;G.job.lost=(G.job.lost||0)+l;G.rep[G.job.fac]-=1}const c=Math.round(G.credits*.15/10)*10;G.credits-=c;L.push(`They take ${l} units and ${c} cr, then leave.`);endCombat('surrender')}
 else if(ti==2){if(G.job){G.job.lost=(G.job.lost||0)+G.job.units;G.job.units=0;G.rep[G.job.fac]-=1}const c=Math.round(G.credits*.25/10)*10;G.credits-=c;L.push(`They strip your cargo and ${c} cr.`);endCombat('surrender')}
 else if(ti==1){if(G.job){G.job.lost=(G.job.lost||0)+G.job.units;G.job.units=0}const c=Math.round(G.credits*.5/10)*10;G.credits-=c;AMMO.forEach(k=>G.ship[k]=Math.floor(G.ship[k]/2));L.push(`Cargo, ${c} cr and half your munitions gone.`);endCombat('surrender')}

 if(ti<=2){G.credits=Math.floor(G.credits*.4);if(G.job){G.job.lost=(G.job.lost||0)+G.job.units;G.job.units=0}const l=G.crew.reduce((a,c)=>c.stress>a.stress?c:a,G.crew[0]);if(G.crew.length>1){G.crew=G.crew.filter(c=>c!==l);log(l.name+' was taken off the ship.','bad')}G.ship.hull=8;AMMO.forEach(k=>G.ship[k]=Math.floor(G.ship[k]/2));log('Captured and stripped. You are towed to port with a skeleton hull.','bad')}
 else{G.credits=Math.floor(G.credits*.8);if(G.job){G.job.lost=(G.job.lost||0)+G.job.units;G.job.units=0}G.ship.hull=Math.max(4,G.ship.hull);log('Cargo lost, but the ship and crew limp away.','bad')}
 G.loc=G.trip?G.trip.from:G.loc;G.trip=null;G.day+=3;G.dest=null;G.queue=[];G.cb=G.cb&&G.cb.over=='lost'?G.cb:null;if(G.cb){G.cb.log.push('You are out of the fight. The enemy leaves you adrift.');}if(!G.cb){G.inc=null;G.phase='station';genStation()}}
function leaveCombat(){const cb=G.cb;if(!cb)return;const lost=cb.over=='lost';G.cb=null;

 if(cb.over=='surrender'&&false){}

/* ---------- action dispatcher ---------- */
function act(a,v,w){if(!G||G.over&&a!='new')return;let msg='';const n=+v;
 switch(a){
 case'new':newGame(v?+v:null);break;
 case'endseason':endRun();break;
 case'frepair':msg=fieldRepair();break;
 case'jury':msg=jury();break;
 case'ration':G.ration=v;log(RATION[v].n+': '+RATION[v].note);break;
 case'burnmid':msg=changeBurn(v);break;
 case'cannibal':msg=cannibalize(v);break;
 case'tab':G.tab=v;break;
 case'buy':msg=buy(v,+w||1);break;
 case'job':msg=acceptJob(v);break;
 case'dropjob':msg=dropJob();break;
 case'dest':G.dest=v;break;
 case'burn':G.burn=v;break;
 case'depart':msg=depart();break;
 case'heal':{const c=G.crew.find(x=>x.id==n);msg=heal(c);break}
 case'treat':msg=treat(n);break;
 case'shore':msg=shore();break;
 case'rhull':msg=repairHull(n||1);break;
 case'rfault':msg=repairFault(n);break;
 case'rsubs':msg=repairSubs();break;
 case'loan':payLoan(n);break;
 case'hire':msg=hire();break;
 case'upg':msg=upgrade(v);break;case'mount':msg=installMount(v,w=='none'?null:w);break;
 case'advance':msg=advance2();break;
 case'fire':fire(n);break;
 case'day':advance();break;
 case'ap':pickAp(n,w?+w:null);break;
 case'crew':if(G.inc&&!G.inc.res)G.inc.sel.crew=n;break;
 case'fate':fateReroll();break;
 case'go':resolveInc();break;
 case'ord':G.cb.o[v]=w;if(v=='weapon')G.cb.o.fire=0;if(v=='head'&&w!='hold')G.cb.o.helm='hold';if(v=='helm')G.cb.o.head='hold';break;case'lvl':G.cb.o.fire=+w;break;
 case'round':combatRound();break;
 case'surr':surrender();break;
 case'leave':leaveCombat();break;
 }
 if(G&&G.phase=='station'&&G.st)G.st.peak=Math.max(G.st.peak,G.credits);
 G.msg=msg;if(typeof render=='function')render();return msg}

function stationHTML(){const g=G,tabs=['jobs','shop','crew','ship','refit','loan'];

 else if(g.tab=='shop'){body=['fuel','food','spares','meds','slug','torp','belt','cm'].map(k=>{const nm={fuel:'Fuel',food:'Food',spares:'Spare parts',meds:'Meds',slug:'Rail slugs (railgun)',torp:'Torpedoes',belt:'PDC belts',cm:'Decoys (flares and chaff)'}[k];const have=k=='food'?g.ship.food.toFixed(1):g.ship[k];return`<div class="row"><div><b>${nm}</b><small>${price(k)} cr each · have ${have}${HOLDW[k]?` · takes ${HOLDW[k]} hold`:' · tank'}</small></div><div class="r">${(k=='torp'?[1,2,4]:[1,5,10]).map(q=>btn('buy',k,q,'+'+q,'',!!canBuy(k,q))).join('')}</div></div>`}).join('')+'<p class="note">Hold capacity is shared by cargo, food, spares, meds and ammunition. Torpedoes are heavy and expensive but hit hardest; PDC belts also feed your point defense, so keep some in reserve. Decoys draw torpedoes off. Fuel is in separate tanks.</p>'}
 else if(g.tab=='crew'){body=g.crew.map(c=>`<div class="row crewrow">${crewRow(c)}<div class="acts">${c.inj?btn('treat',c.id,null,'Treat (1 med)','',g.ship.meds<1)+btn('heal',c.id,null,'Medbay '+60*c.inj,'',g.credits<60*c.inj):''}${btn('fire',c.id,null,'Dismiss','ghost',g.crew.length<2)}</div></div>`).join('')+
  `<div class="row"><div><b>Shore leave</b><small>Everyone loses 4 stress. Costs ${80*g.crew.length} cr and a day.</small></div>${btn('shore',null,null,'Take it','',g.credits<80*g.crew.length)}</div>`+
  (g.hire?`<div class="row"><div><b>Hire: ${g.hire.name}</b><small>${g.hire.tr.join(', ')} · ${g.hire.bg} · ${SK.filter(k=>g.hire.sk[k]>0).map(k=>SKS[k]+' '+g.hire.sk[k]).join(' · ')} · wage ${g.hire.wage}/mo</small></div>${btn('hire',null,null,'Hire 150','',g.credits<150||g.crew.length>=6)}</div>`:'<p class="note">No one is looking for work here today.</p>')}
 else if(g.tab=='ship'){body=`<div class="mnt"><b>Weapons and arcs</b>${mountsHTML()}</div><div class="row"><div><b>Hull repair</b><small>25 cr per point</small></div><div class="r">${btn('rhull',5,null,'+5','',g.ship.hull+5>g.ship.hullMax||g.credits<125)}${btn('rhull',g.ship.hullMax-Math.ceil(g.ship.hull),null,'Full','',g.ship.hull>=g.ship.hullMax||g.credits<25*(g.ship.hullMax-g.ship.hull))}</div></div>
  <div class="row"><div><b>Restore subsystems</b><small>20 cr per point</small></div>${btn('rsubs',null,null,'Repair all')}</div>`+g.ship.faults.map((f,i)=>`<div class="row"><div><b>${f.n}</b><small>${f.d}</small></div>${btn('rfault',i,null,'Fix 150','',g.credits<150)}</div>`).join('')+(g.ship.faults.length?'':'<p class="note">No faults.</p>')}
 else if(g.tab=='refit'){body=hardpointsHTML()+Object.keys(UPG).map(k=>{const U=UPG[k],lv=g.up[k]||0,cost=U.cost*(lv+1);return`<div class="row"><div><b>${U.n}${U.max>1?` <small>(${lv}/${U.max})</small>`:lv?' <small>(installed)</small>':''}</b><small>${U.d}</small></div>${btn('upg',k,null,lv>=U.max?'Installed':'Install '+fmt(cost),'',lv>=U.max||g.credits<cost)}</div>`}).join('')+'<p class="note">Upgrades stay with the ship for the whole run.</p>'}
 else{body=`<div class="row"><div><b>Marta Quill</b><small>Owed ${fmt(g.debt)} cr · due day ${DEADLINE}${g.paidInstall?'':' · installment of 1,500 collected on your first dock after day 25'}</small></div></div><div class="row"><div class="r">${btn('loan',500,null,'Pay 500','',g.credits<500||!g.debt)}${btn('loan',1000,null,'Pay 1000','',g.credits<1000||!g.debt)}${btn('loan',g.debt,null,'Pay all','',g.credits<g.debt||!g.debt)}</div></div>
  <div class="row"><div><b>Desperate? Ask for an advance</b><small>+500 credits now, +700 debt. Only if under 300 cr. ${2-(g.advances||0)} left.</small></div>${btn('advance',null,null,'Ask','warnb',g.credits>=300||(g.advances||0)>=2)}</div>`}
 const fin=g.final?`<section class="card final"><div class="tag red">Day ${g.day}: final reckoning</div><h2>Settle up with Quill</h2><p class="txt">The deadline has passed. You owe <b>${fmt(g.debt)}</b> and hold <b>${fmt(g.credits)}</b>. Pay what you can, repair and heal if you like, then end the season.</p><div class="btns">${btn('loan',g.debt,null,'Pay all','',g.credits<g.debt||!g.debt)}${btn('loan',Math.min(g.credits,g.debt),null,'Pay everything I have','warnb',!g.debt||!g.credits)}${btn('endseason',null,null,'End the season','go')}</div></section>`:'';
 return fin+`<section class="card"><h3>${g.loc} <small>(${PLACES[g.loc].f})</small></h3><nav class="tabs">${tabs.map(t=>`<button class="${g.tab==t?'on':''}" data-a="tab" data-v="${t}">${{jobs:'Jobs',shop:'Shop',crew:'Crew',ship:'Ship',refit:'Refit',loan:'Loan'}[t]}</button>`).join('')}</nav><div class="tb">${body}</div></section>`+(g.final?'':plan())}
function travelHTML(){const g=G,t=g.trip;const pct=clamp(t.done/t.total*100,0,100);
 return`<section class="card"><h3>${t.from} → ${t.to}</h3>${meter(t.done,t.total,'',`Day ${t.done} of ${t.total} · ${BURN[t.burn].n} · threat ${THN[t.threat]}`)}

 ${conserveHTML()}<div class="btns">${btn('day',null,null,'Advance 1 day','')}${btn('run',null,null,UI.running?'Pause':'Run ▶',UI.running?'warnb':'go')}</div><p class="note">The clock runs until something needs a decision.</p></section>`}
function conserveHTML(){const g=G,t=g.trip,pj=projection(),s=g.ship;const sh=[];if(pj.fuelShort)sh.push(`<span class="neg">Fuel short by ${pj.fuelShort}</span>`);if(pj.foodShort)sh.push(`<span class="neg">Food short by ${pj.foodShort}</span>`);
 const burns=['cruise','hard','eco'].map(k=>{const b=BURN[k],rc=(t.total-t.done)/BURN[t.burn].days,d=Math.max(1,Math.ceil(rc*b.days-.01)),f=Math.round(d*b.fuel*fr());return`<button class="brn ${t.burn==k?'on':''}" data-a="burnmid" data-v="${k}"><b>${b.n}</b><small>${d} d left · ${f} fuel</small></button>`}).join('');
 const rats=['full','half','quarter'].map(k=>`<button class="brn ${g.ration==k?'on':''}" data-a="ration" data-v="${k}"><b>${RATION[k].n}</b><small>${RATION[k].note}</small></button>`).join('');
 return`<div class="cons"><h4>Conserve supplies</h4><div class="sum"><span>Still needed: fuel ${pj.fuel} <small>(have ${Math.floor(s.fuel)})</small></span><span>food ${pj.food} <small>(have ${s.food.toFixed(1)})</small></span></div>${sh.length?`<div class="eff">${sh.join('')}</div>`:''}
 <small>Burn: slower burns save fuel but take more days (more chances for trouble).</small><div class="brns">${burns}</div><small>Rations</small><div class="brns">${rats}</div>
 <small>Spare parts and repairs</small><div class="btns">${btn('jury',null,null,'Jury-rig (no spare)','sm',g.fixDay===g.day)}${btn('cannibal','sens',null,'Strip sensors for 2 spares','sm',s.sub.sens<2)}${btn('cannibal','pdc',null,'Strip PDC for 2 spares','sm',s.sub.pdc<2)}</div><small>Jury-rig is a weaker patch that costs no parts. Stripped systems stay damaged until repaired at port.</small></div>`}
function oddsFor(ap,c){return ap.sk&&c?odds(modFor(ap,c)):null}
function incidentHTML(){const inc=G.inc;if(!inc)return '';const adv=advisor();let h=`<section class="card inc"><div class="tag">${({mech:'Ship trouble',nav:'Navigation',med:'Medical',social:'Crew',enc:'Encounter',econ:'Trade',quest:'Story'})[inc.inc.tag]||'Incident'}</div><h2>${inc.title}</h2><p class="txt">${inc.text}</p>`;
 if(adv&&adv.pick!=null&&!inc.res){const ap=inc.ap[adv.pick];h+=`<p class="adv"><b>${adv.who.name.split(' ')[0]}</b> <small>(${adv.who.tr[0]})</small>: “I'd ${ap.label.toLowerCase()}.”</p>`}
 if(!inc.res){h+=inc.ap.map((ap,i)=>{const lock=ap.need?ap.need(G):'';const cs=ap.sk?(alive().length?alive():G.crew):[];const sel=UI.crew[i]!=null&&cs.some(c=>c.id==UI.crew[i])?cs.find(c=>c.id==UI.crew[i]):bestFor(ap);
  return`<div class="ap ${lock?'lock':''} ${adv&&adv.pick==i?'rec':''}"><div class="aph"><b>${ap.label}</b><span class="rk r${ap.risk}">${['Safe','Bold','Gamble'][ap.risk]}</span>${ap.sk?`<span class="sk">${SKN[ap.sk]}</span>`:'<span class="sk">No roll</span>'}</div>
  ${ap.sk&&sel?`<div class="chips">${cs.map(c=>`<button class="chip ${c.id==sel.id?'on':''}" data-a="pc" data-v="${i}" data-w="${c.id}">${c.name.split(' ')[0]} <small>${modFor(ap,c)>=0?'+':''}${modFor(ap,c)}</small></button>`).join('')}</div>${oddsBar(oddsFor(ap,sel))}`:`<p class="note">${ap.out.A?ap.out.A[0]:''}</p>`}
  ${lock?`<span class="why">${lock}</span>`:btn('ap',i,sel?sel.id:null,ap.sk?`Roll with ${sel?sel.name.split(' ')[0]:'—'}`:'Choose','go')}</div>`}).join('')}
 else{const r=inc.res;const ch=chips(r.effs,{actor:r.crew||null,subject:inc.S,sk:r.ap.sk});
  h+=`<div class="res2 t${r.tier==null?'a':r.tier}"><div class="rh"><b>${r.ap.label}</b>${r.tier!=null?` ${dice(r.d)} <span class="md">${r.mod>=0?'+':''}${r.mod}</span> = <b>${r.total}</b>`:''}</div>${r.tier!=null?`<div class="tr">${TIERS[r.tier]}${r.re?' <small>(rerolled)</small>':''}</div>`:''}<p>${r.text}</p><div class="eff">${ch.map(c=>`<span class="${/(\+|saved)/.test(c)&&!/stress \+|Injury|Combat|Ambush|fault|Hull -|Fuel -|Food -|Credits -|rep -/i.test(c)?'pos':'neg'}">${c}</span>`).join('')}</div></div>
  <div class="btns">${r.tier!=null&&r.tier<=2&&G.fate>0&&!r.re?btn('fate',null,null,'Spend a fate point to reroll','warnb'):''}${btn('go',null,null,'Continue','go')}</div>`}
 return h+'</section>'}
function scopeHTML(cb){const e=cb.e,o=cb.o,C=160,P=(a,r)=>{const t=(a-90)*Math.PI/180;return[C+r*Math.cos(t),C+r*Math.sin(t)]},f=x=>x.toFixed(1),pt=(a,r)=>P(a,r).map(f).join(' ');
 const wedge=(i,r0,r1)=>{const a0=i*60-30,a1=i*60+30;return`M${pt(a0,r0)}L${pt(a0,r1)}A${r1} ${r1} 0 0 1 ${pt(a1,r1)}L${pt(a1,r0)}A${r0} ${r0} 0 0 0 ${pt(a0,r0)}Z`};
 const RR=[108,72,34],RING=[124,90,52];
 let s=`<svg class="scope" viewBox="0 0 320 320" role="img" aria-label="Tactical scope: enemy at ${RANGE[cb.range]} range, ${SECN[cb.bear].toLowerCase()}">`;
 SEC6.forEach(i=>{const ok=armFor(o.weapon,i).ok;s+=`<path d="${wedge(i,0,124)}" class="sec ${ok?'arc':''} ${cb.bear==i?'cur':''}"/>`});
 RING.forEach((r,i)=>{s+=`<circle cx="${C}" cy="${C}" r="${r}" class="ring ${cb.range==i?'on':''}"/><text x="${C+3}" y="${C+r-3}" class="rl">${RANGE[i].toUpperCase()}</text>`});
 s+=`<circle cx="${C}" cy="${C}" r="${RR[e.pref]}" class="pref"/>`;
 SEC6.forEach(i=>{const a=i*60+30,[x,y]=P(a,124);s+=`<line x1="${C}" y1="${C}" x2="${f(x)}" y2="${f(y)}" class="spoke"/>`});
 SEC6.forEach(i=>{const n=covCount('pdc',i),x2=extCount('pdc',i),[x,y]=P(i*60,135.5);s+=`<path d="${wedge(i,128,142)}" class="pb ${n?'p'+Math.min(n,3):x2?'px':'p0'}"/><text x="${f(x)}" y="${f(y+3)}" class="pbn">${n?n:x2?'~':'✕'}</text>`});
 SEC6.forEach(i=>{const [x,y]=P(i*60,151);s+=`<text x="${f(x)}" y="${f(y+3)}" class="sl ${cb.bear==i?'on':''}">${SECS[i]}</text>`});
 const [ex,ey]=P(cb.bear*60,RR[cb.range]);
 (cb.fxIn||[]).forEach(t=>{const a=t.sec*60,[x0,y0]=P(a,142),[x1,y1]=P(a,t.res=='down'?64:16);s+=`<line x1="${f(x0)}" y1="${f(y0)}" x2="${f(x1)}" y2="${f(y1)}" class="tin ${t.res}"/>`;
  if(t.res=='down')s+=`<path d="M${f(x1-4)} ${f(y1-4)}l8 8m0-8l-8 8" class="tx"/>`;else s+=`<circle cx="${f(x1)}" cy="${f(y1)}" r="6" class="tb"/>`});
 if(cb.fxOut)s+=`<line x1="${C}" y1="${C-12}" x2="${f(ex)}" y2="${f(ey)}" class="tout ${cb.fxOut.w} ${cb.fxOut.hit?'hit':'miss'}"/>`;
 if(cb.pbear!=null&&(cb.pbear!==cb.bear||cb.prev!==cb.range)&&!cb.over){const [gx,gy]=P(cb.pbear*60,RR[cb.prev]);s+=`<line x1="${f(gx)}" y1="${f(gy)}" x2="${f(ex)}" y2="${f(ey)}" class="mv"/><circle cx="${f(gx)}" cy="${f(gy)}" r="7" class="ghost"/>`}
 s+=`<polygon points="160,146 168,170 160,165 152,170" class="you"/><text x="160" y="184" class="nm">YOU</text>`;
 s+=`<g transform="translate(${f(ex)},${f(ey)})"><circle r="9" class="foe"/><circle r="2.6" class="foe2"/></g><text x="${f(ex)}" y="${f(ey+20)}" class="nm foen">${ename(e).toUpperCase()}</text></svg>`;
 const cls=m=>m>=1?'zg':m==0?'zn':m>=-2?'za':'zr';
 const tbl=`<table class="wt"><tr><th></th>${[2,1,0].map(r=>`<th class="${cb.range==r?'now':''}">${RANGE[r]}</th>`).join('')}<th>Arc</th></tr>${['rail','torp','pdc'].map(w=>{const ar=armFor(w);const secs=SEC6.filter(x=>armFor(w,x).ok);return`<tr class="${o.weapon==w?'sel':''}"><td>${w=='rail'?'Rail':w=='torp'?'Torp':'PDC'}</td>${[2,1,0].map(r=>{const m=WMOD[w][r];return`<td class="${cls(m)} ${cb.range==r?'now':''}">${m>0?'+':''}${m}</td>`}).join('')}<td class="${ar.ok?'bears':'nobears'}">${ar.ms.length?(ar.ok?'bears'+(ar.pen?' −'+ar.pen:''):'no arc'):'down'}</td></tr>`}).join('')}</table>`;
 return s+tbl+`<p class="note">The enemy is at your <b>${SECN[cb.bear].toLowerCase()}</b>, ${RANGE[cb.range].toLowerCase()} range. Green shading is the arc of the selected weapon. The outer band counts working PDCs with a ready arc on each sector (~ means only a slow swing reaches it, ✕ means a blind spot). Dashed ring is the range the enemy prefers.</p>`}
function hardpointsHTML(){const g=G,s=g.ship;
 return`<div class="hp"><b>Hardpoints</b><small class="note">Each hardpoint takes any mount that fits its size. Swapping refunds half of the old mount's price.</small>`+s.slots.map(sl=>{const cur=sl.mount?MOUNTCAT[sl.mount]:null,open=UI.slot==sl.id,refund=cur?Math.floor(cur.cost/2):0;

function mountsHTML(){live('pdc');live('rail');return G.ship.mounts.map(m=>`<div class="mrow ${m.dmg?'dn':''}"><span>${m.n}</span><small>${m.t=='pdc'?'ready ':''}${m.arc.map(i=>SECS[i]).join(' · ')}${m.t=='pdc'?(m.mask&&m.mask.length?` · swivels, blind ${m.mask.map(i=>SECS[i]).join(' · ')}`:' · swivels all round'):''}${m.pen?` · −${m.pen} hit`:''}${m.dmg?' · KNOCKED OUT':''}</small></div>`).join('')}
function combatHTML(){const cb=G.cb,e=cb.e,s=G.ship,m=combatMods(),o=cb.o;const over=cb.over;
 const track=RANGE.map((r,i)=>`<div class="band ${cb.range==i?'cur':''} ${e.pref==i?'pref':''}"><span>${r}</span>${cb.range==i?'<b>⇄</b>':''}</div>`).join('');
 const sbar=(sub,mx,nm)=>`<span class="${sub<=0?'out':sub<mx?'dmg':''}">${nm} ${sub}</span>`;
 const hdr=`<section class="card cmb"><div class="tag red">Combat · round ${cb.round}</div><h2>${e.name}</h2><div class="grid2">${meter(Math.max(0,e.hull),e.max,'bad',`Enemy hull ${Math.max(0,e.hull)}/${e.max}`)}${meter(Math.max(0,s.hull),s.hullMax,s.hull/s.hullMax<.35?'bad':'good',`Your hull ${Math.max(0,Math.ceil(s.hull))}/${s.hullMax}`)}</div>
 <div class="subs"><span class="lab">Enemy</span>${sbar(e.sub.drive,e.drive,'Drive')}${sbar(e.sub.weap,e.weap,'Weap')}${sbar(e.sub.sens,e.sens,'Sens')}${sbar(e.sub.pdc,e.pdc,'PDC')}<span class="lab">Enemy likes ${RANGE[e.pref]} range</span></div>
 ${scopeHTML(cb)}`;
 if(over){const msg={win:'Victory.',fled:'The enemy ran. You hold the field.',flee:'You broke contact.',parley:'The shooting stops.',surrender:'You surrendered.',lost:'You are beaten.'}[over];
  return hdr+`<div class="log cl">${cb.log.slice(-9).map(x=>`<p>${x}</p>`).join('')}</div><p class="over">${msg}</p><div class="btns">${btn('leave',null,null,'Continue','go')}</div></section>`}
 const opt=(k,v,lab,sub)=>`<button class="op ${o[k]==v?'on':''}" data-a="ord" data-v="${k}" data-w="${v}">${lab}${sub?`<small>${sub}</small>`:''}</button>`;
 const nm=(c)=>c?c.name.split(' ')[0]:'nobody';
 const oa=oddsAtk(),s0=G.ship,fl=fireLv();
 return hdr+`<div class="orders"><h4>Helm — ${nm(m.h)} <small>${m.hm>=0?'+':''}${m.hm}</small></h4><div class="ops">${opt('helm','close','Close in','toward Close')}${opt('helm','open','Open range','toward Long')}${opt('helm','evade','Evade','+2 defense')}${opt('helm','hold','Hold','keep station')}</div>
 <div class="ops">${[['face','Face enemy'],['guns','Bring guns to bear'],['pdc','Cover with PDCs'],['away','Turn away']].map(([k,l])=>{const d=headTarget(k),tot=turnOdds(),pr=Math.round((1-tot[0]-tot[1])*100);return opt('head',k,l,d==cb.bear?'already there':`to ${SECS[d].toLowerCase()} · ${pr}% turn`)}).join('')}</div>
 <h4>Gunnery — ${nm(m.g)}</h4><div class="ops">${['rail','torp','pdc'].map(k=>opt('weapon',k,WN[k],`${WMOD[k][cb.range]>=0?'+':''}${WMOD[k][cb.range]} here · ${s0[WAM[k]]} ${AS[WAM[k]]}${armFor(k).ok?'':' · NO ARC'}`)).join('')}</div>
 <div class="ops">${WFIRE[o.weapon].map((f,i)=>{const dm=(WDMG[o.weapon]+(o.weapon=='rail'?(G.up.rail||0)+armFor('rail').bonus:0)+f.d)*(o.weapon=='torp'?f.n:1);return`<button class="op ${fl.i==i?'on':''}" ${s0[WAM[o.weapon]]<f.n?'disabled':''} data-a="lvl" data-w="${i}">${f.l}<small>${f.n} ${f.n==1?AS[WAM[o.weapon]].replace(/s$/,''):AS[WAM[o.weapon]]} · ${dm} dmg${f.a?' · +'+f.a+' hit':''}</small></button>`}).join('')}</div>
 <div class="ops">${['hull','drive','weap','sens'].map(k=>opt('target',k,TARGN[k],k=='hull'?'':'−1, knocks out')).join('')}</div>${oddsBar(oa)}
${e.torps>0?`<h4>Torpedo defense <small>enemy rack: ${e.torps}</small></h4><div class="ops">${Object.keys(TDOC).map(k=>{const L=tdLayer(k,null,k);const dis=(k=='flak'||k=='decoy'||k=='spin')&&!L.av;return`<button class="op ${o.tdef==k?'on':''}" ${dis?'disabled':''} data-a="ord" data-v="tdef" data-w="${k}">${TDOC[k].n}<small>${TDOC[k].s} · stops ~${Math.round(tdChance(k)*100)}%</small></button>`}).join('')}</div><p class="note">A torpedo now would come in from your ${SECN[cb.bear].toLowerCase()}; ${covCount('pdc',cb.bear)} ready PDC${covCount('pdc',cb.bear)==1?'':'s'}${extCount('pdc',cb.bear)?` and ${extCount('pdc',cb.bear)} that must slew round (−2)`:''} cover it. Layers: the first you pick, then free backups.${covCount('pdc',cb.bear)==0&&live('pdc').length?' <b class="warn">No PDC has a ready arc here. Your pilot and gunner can spin the ship to put one on it.</b>':''}</p>`:''}
 <h4>Engineering — ${nm(m.en)}</h4><div class="ops">${opt('eng','repair','Damage control','fix / patch')}${opt('eng','pw','Power weapons','+2 attack')}${opt('eng','ph','Power helm','+2 helm, defense')}${opt('eng','over','Overload','+2 all, may backfire')}</div>
 <h4>Command</h4><div class="ops">${opt('stance','aggr','Aggressive','+1 atk, −1 def')}${opt('stance','def','Defensive','−1 atk, +1 def')}${opt('stance','diseng','Disengage','needs good range')}${e.kind=='raider'?'':opt('stance','parley','Parley','talk, no attack')}</div></div>
 <div class="btns">${btn('round',null,null,'Fire round','go')}${e.kind=='raider'?'':btn('surr',null,null,'Surrender','warnb')}</div>
 <div class="log cl">${cb.log.slice(-8).map(x=>`<p>${x}</p>`).join('')}</div></section>`}
function overHTML(){const g=G,o=g.over,st=g.st;
 return`<section class="card over2 ${o.win?'win':'lose'}"><div class="tag">${o.win?'Free and clear':'Run over'}</div><h2>${o.win?'You paid off the Kestrel':'The company ends here'}</h2><p class="txt">${o.text}</p>
 <div class="sum2"><span>Days <b>${g.day}</b></span><span>Jobs delivered <b>${st.delivered}</b></span><span>Earned <b>${fmt(st.earned)}</b></span><span>Debt left <b>${fmt(g.debt)}</b></span><span>Decisions <b>${st.dec}</b></span><span>Rolls <b>${st.rolls}</b> <small>(${st.tiers.map((n,i)=>TIERS[i][0]+n).join(' ')})</small></span><span>Fate used <b>${st.fate}</b></span><span>Fights <b>${st.combats}</b> · ${st.rounds} rounds</span><span>Injuries <b>${st.hurt}</b> · deaths <b>${st.dead}</b></span><span>Breakdowns <b>${st.breaks}</b></span><span>Story <b>${g.q.done?'finished':g.q.stage>0?'in progress':'untouched'}</b></span></div>
 <p class="note">Rep: ${FACT.map(f=>f+' '+(g.rep[f]>0?'+':'')+g.rep[f]).join(' · ')}</p>
 ${g.dead.length?`<p class="note">Lost: ${g.dead.join(', ')}</p>`:''}
 <h4>What happened at the end</h4><div class="log cl">${g.log.slice(0,8).reverse().map(l=>`<p class="${l.c}"><small>D${l.d}</small> ${l.t}</p>`).join('')}</div><div class="btns">${btn('new',null,null,'New run','go')}</div></section>`+feedbackHTML(true)}
const FQ=[['fun','Did the decisions feel meaningful? Which one stuck with you?'],['combat','How did combat feel?'],['drag','Where did it drag or confuse you?'],['change','If you could change one thing, what?']];
UI.fb={rate:0,name:'',a:{},sent:'',open:false};
function reportText(){const g=G,st=g.st;return`HARD BURN prototype run\nResult: ${g.over?(g.over.win?'Paid off':'Lost: '+g.over.why):'in progress'} on day ${g.day}. Debt left ${fmt(g.debt)}, credits ${fmt(g.credits)}.\nDecisions ${st.dec}, rolls ${st.rolls} (${st.tiers.map((n,i)=>TIERS[i][0]+n).join(' ')}), fate used ${st.fate}, fights ${st.combats} (${st.rounds} rounds), injuries ${st.hurt}, deaths ${st.dead}, breakdowns ${st.breaks}, jobs ${st.delivered}.\nStory: ${g.q.done?'finished':g.q.stage>0?'in progress':'untouched'}.\nDecision log:\n${g.dlog.slice(-40).join('\n')}`}
function feedbackHTML(auto){if(!auto&&!UI.fb.open)return'';const f=UI.fb;
 return`<section class="card fb"><h3>Feedback</h3><p class="note">Your answers and a summary of your run go to the designer. No account details are sent.</p>
 <div class="chips">${[1,2,3,4,5].map(n=>`<button class="chip ${f.rate==n?'on':''}" data-a="fbrate" data-v="${n}">${n}</button>`).join('')}<small>1 = dull, 5 = want to play again</small></div>
 <label class="fl" for="fbname">Your name (optional)</label><input id="fbname" class="inp" data-fb="name" value="${(f.name||'').replace(/"/g,'&quot;')}" maxlength="40">
 ${FQ.map(q=>`<label class="fl" for="fb_${q[0]}">${q[1]}</label><textarea id="fb_${q[0]}" class="inp" data-fb="${q[0]}" rows="2" maxlength="600">${(f.a[q[0]]||'').replace(/</g,'&lt;')}</textarea>`).join('')}
 <div class="btns">${btn('fbsend',null,null,'Send feedback','go',!f.rate&&!Object.values(f.a).some(Boolean))}${btn('fbcopy',null,null,'Copy as text','')}</div>${f.sent?`<p class="warn">${f.sent}</p>`:''}${f.copyText?`<textarea id="fbcopy" class="inp" rows="6" readonly>${f.copyText.replace(/</g,'&lt;')}</textarea>`:''}</section>`}
function fbPayload(){const f=UI.fb;return{when:Date.now(),rating:f.rate,name:f.name,answers:f.a,report:reportText(),build:'proto-2'}}
function fbText(){const f=UI.fb,p=fbPayload();return`HARD BURN FEEDBACK${f.name?' from '+f.name:''}\nFun rating: ${f.rate||'–'}/5\n${FQ.map(q=>q[1]+'\n'+(f.a[q[0]]||'–')).join('\n\n')}\n\n${p.report}`}
function logHTML(){return`<section class="card"><h3>Ship's log</h3><div class="log">${G.log.slice(0,UI.logOpen?60:8).map(l=>`<p class="${l.c}"><small>D${l.d}</small> ${l.t}</p>`).join('')}</div><div class="btns"><button class="b ghost" data-a="logtoggle">${UI.logOpen?'Show less':'Show more'}</button>${btn('fbtoggle',null,null,'Feedback','ghost')}${btn('new',null,null,'Restart run (loses progress)','ghost')}</div></section>`+(G.phase=='over'?'':feedbackHTML(false))}
function render(){if(!DOM)return;const g=G;let main='';
 if(g.phase=='over')main=overHTML();else if(g.phase=='combat'&&g.cb)main=combatHTML();else if(g.phase=='incident'&&g.inc)main=incidentHTML();else if(g.phase=='travel'&&g.trip)main=travelHTML();else main=stationHTML();
 if(UI.showHelp&&g.day==1&&g.phase=='station')main=`<section class="card help"><h3>How this works</h3><p>You owe Marta Quill <b>6,500 credits by day 50</b>. Take contracts, stock the ship, and fly. Every roll is 2d6 plus skill; odds are shown before you commit. Hard Burn saves days and risks people. When something happens, you decide how to respond and who does it.</p>${btn('helpx',null,null,'Got it','go')}</section>`+main;
 $('#app').innerHTML=head()+`<main>${main}</main>`+(g.phase=='combat'||g.phase=='incident'?'':'')+statusHTML()+logHTML();
 if(UI.scroll){window.scrollTo({top:0});UI.scroll=0}}
if(DOM){document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.fb;if(!k)return;if(k=='name')UI.fb.name=e.target.value;else UI.fb.a[k]=e.target.value});
 (async()=>{try{if(window.claude&&claude.use)UI.db=await claude.use('db')}catch(e){}})();
 document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v,w=b.dataset.w;
 if(a=='pc'){UI.crew[+v]=+w;render();return}
 if(a=='run'){if(UI.running){clearInterval(UI.timer);UI.running=0;render()}else{UI.running=1;UI.timer=setInterval(()=>{if(G.phase!='travel'){clearInterval(UI.timer);UI.running=0;render();return}act('day')},420);render()}return}
 if(a=='fbrate'){UI.fb.rate=+v;render();return}
 if(a=='fbtoggle'){UI.fb.open=!UI.fb.open;render();return}
 if(a=='fbcopy'){const t=fbText();let ok=false;try{navigator.clipboard.writeText(t).then(()=>{UI.fb.sent='Copied. Paste it into a message to the designer.';render()},()=>{UI.fb.copyText=t;UI.fb.sent='Copy was blocked. Select the text below and copy it.';render()});ok=true}catch(e){}if(!ok){UI.fb.copyText=t;UI.fb.sent='Select the text below and copy it.';render()}return}
 if(a=='fbsend'){(async()=>{UI.fb.sent='Sending…';render();try{if(!UI.db)throw new Error('db');await UI.db.collection('feedback').add(fbPayload());UI.fb.sent='Sent. Thank you!'}catch(e){UI.fb.copyText=fbText();UI.fb.sent='Could not send from here. Use Copy as text and send it directly.'}render()})();return}
 if(a=='helpx'){UI.showHelp=false;render();return}
 if(a=='logtoggle'){UI.logOpen=!UI.logOpen;render();return}
 if(a=='slotopen'){UI.slot=UI.slot==v?null:v;render();return}
 if(a=='ap'||a=='go'||a=='round'||a=='leave'||a=='depart'||a=='new'||a=='fate')UI.scroll=a!='fate'&&a!='round'&&a!='ap';
 if(UI.running&&G.phase!='travel'){clearInterval(UI.timer);UI.running=0}
 act(a,v,w)});
 newGame();render()}
if(typeof globalThis!=='undefined'&&!DOM)globalThis.HB={act,newGame,get G(){return G}};

</script>
